seed: 42

data:
  source_url: "http://www.developingconnectome.org/"
  node_csv: "data/BrainNodeDefs.csv"
  metadata_csv: "data/patient_metadata.csv"
  matrices_npy: "data/matrices.npy"

model:
  num_nodes: 90
  hidden_dim: 32
  internal_dim: 256

training:
  batch_size: 16
  epochs: 300
  learning_rate: 3.0e-4
  gradient_clip: 1.0
  patience: 30          # Early stopping

loss:
  type: combined        # l1, spectral, laplacian, sparse, combined
  alpha_spectral: 0.001
  beta_laplacian: 0.0005
  gamma_sparse: 0.0
  spectral_top_k: 10

diffusion:
  num_steps_train: 100
  num_steps_sample: 50
  cfg_scale: 2.0        # Classifier-free guidance

validation:
  every_n_epochs: 50
  num_samples: 5

output_dir: "outputs"
